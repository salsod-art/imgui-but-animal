name: Build libimgui.so (Quest / arm64)

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:      # lets you trigger a build manually from the Actions tab

jobs:
  build-quest:
    runs-on: ubuntu-latest
    name: Build - Quest (arm64-v8a)

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout your fork (which contains imgui + your imgui-vr/ folder)
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -----------------------------------------------------------------------
      # 2. Android NDK — pinned to r26c (stable, supports API 26+ / Quest)
      # -----------------------------------------------------------------------
      - name: Setup Android NDK r26c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: true

      # -----------------------------------------------------------------------
      # 3. OpenXR SDK — build the loader for arm64
      # -----------------------------------------------------------------------
      - name: Cache OpenXR SDK
        uses: actions/cache@v4
        id: cache-openxr
        with:
          path: openxr-sdk-build
          key: openxr-arm64-${{ runner.os }}-r26c-v1

      - name: Build OpenXR SDK (arm64-v8a)
        if: steps.cache-openxr.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenXR-SDK openxr-sdk-src
          cmake -S openxr-sdk-src -B openxr-sdk-build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_CONFORMANCE_TESTS=OFF
          cmake --build openxr-sdk-build --config Release -j$(nproc)

      # -----------------------------------------------------------------------
      # 4. Dobby — Android hook library (arm64)
      # -----------------------------------------------------------------------
      - name: Cache Dobby
        uses: actions/cache@v4
        id: cache-dobby
        with:
          path: dobby-build
          key: dobby-arm64-${{ runner.os }}-r26c-v1

      - name: Build Dobby (arm64-v8a)
        if: steps.cache-dobby.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby dobby-src
          cmake -S dobby-src -B dobby-build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DAndroid=true \
            -DDOBBY_DEBUG=OFF
          cmake --build dobby-build --config Release -j$(nproc)

      # -----------------------------------------------------------------------
      # 5. Build libimgui.so
      # -----------------------------------------------------------------------
      - name: Configure libimgui.so
        run: |
          cmake -S imgui-vr -B build-quest \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMGUI_DIR=${{ github.workspace }} \
            -DOPENXR_DIR=${{ github.workspace }}/openxr-sdk-src \
            -DDOBBY_DIR=${{ github.workspace }}/dobby-src \
            -DIMGUI_VR_VULKAN=ON \
            -DIMGUI_VR_MINHOOK=OFF \
            -DIMGUI_VR_DOBBY=ON
        env:
          # Tell the OpenXR cmake where we put the built loader
          OPENXR_BUILD_DIR: ${{ github.workspace }}/openxr-sdk-build

      - name: Build libimgui.so
        run: cmake --build build-quest --config Release -j$(nproc)

      # -----------------------------------------------------------------------
      # 6. Upload the .so as a build artifact
      #    Download it from the Actions tab → your workflow run → Artifacts
      # -----------------------------------------------------------------------
      - name: Upload libimgui.so
        uses: actions/upload-artifact@v4
        with:
          name: libimgui-quest-arm64
          path: build-quest/libimgui.so
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # 7. Also show the file size so you can sanity-check it built correctly
      # -----------------------------------------------------------------------
      - name: Show artifact info
        run: |
          echo "=== libimgui.so ===" 
          ls -lh build-quest/libimgui.so
          file build-quest/libimgui.so
          echo ""
          echo "Symbols (ImGui + OpenXR hook entrypoints):"
          nm -D build-quest/libimgui.so 2>/dev/null | grep -E "ImGui|xrEndFrame|lib_init" | head -20
