name: Build libimgui.so (Quest / arm64)

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-quest:
    runs-on: ubuntu-latest
    name: Build - Quest (arm64-v8a)

    steps:
      # -----------------------------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Setup Android NDK r26c
      # -----------------------------------------------------------------------
      - name: Setup Android NDK r26c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          add-to-path: true

      # -----------------------------------------------------------------------
      # OpenXR SDK (cached)
      # -----------------------------------------------------------------------
      - name: Cache OpenXR build
        uses: actions/cache@v4
        id: cache-openxr
        with:
          path: openxr-build
          key: openxr-arm64-r26c-v2

      - name: Clone OpenXR SDK
        run: |
          if [ ! -d openxr-src ]; then
            git clone --depth 1 https://github.com/KhronosGroup/OpenXR-SDK openxr-src
          fi

      - name: Build OpenXR SDK
        if: steps.cache-openxr.outputs.cache-hit != 'true'
        run: |
          cmake -S openxr-src -B openxr-build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_CONFORMANCE_TESTS=OFF
          cmake --build openxr-build -j$(nproc)

      # -----------------------------------------------------------------------
      # Dobby (cached)
      # -----------------------------------------------------------------------
      - name: Cache Dobby build
        uses: actions/cache@v4
        id: cache-dobby
        with:
          path: dobby-build
          key: dobby-arm64-r26c-v7

      - name: Clone Dobby
        run: |
          if [ ! -d dobby-src ]; then
            git clone --depth 1 https://github.com/jmpews/Dobby dobby-src
          fi

      - name: Patch Dobby for Android (remove macOS ASM + guard asm flag)
        if: steps.cache-dobby.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          # Fix: add missing includes and replace OSMemory usage
          OSM="dobby-src/common/os_arch_features.h"
          if [ -f "$OSM" ]; then
            sed -i '1s|^|#include <unistd.h>\n#include <sys/mman.h>\n|' "$OSM" || true
            sed -i 's|OSMemory::PageSize()|sysconf(_SC_PAGESIZE)|g' "$OSM" || true
            sed -i 's@OSMemory::SetPermission(page, OSMemory::PageSize(), kReadExecute)@mprotect(page, sysconf(_SC_PAGESIZE), PROT_READ | PROT_EXEC) == 0@g' "$OSM" || true
            echo "Patched $OSM"
          else
            echo "Warning: $OSM not found; skipping OSM patch"
          fi

          # Remove macOS-only arm64 ASM files so Android assembler won't try to compile them
          rm -f dobby-src/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm
          rm -f dobby-src/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_trampoline_arm64.asm

          # Guard BUILD_WITH_TRAMPOLINE_ASM so it's NOT enabled for Android builds
          # Wrap the compile_definitions addition with an if(NOT ANDROID) ... endif()
          if grep -q "BUILD_WITH_TRAMPOLINE_ASM" dobby-src/CMakeLists.txt; then
            sed -i 's@set(compile_definitions "${compile_definitions} -DBUILD_WITH_TRAMPOLINE_ASM")@if(NOT ANDROID)\nset(compile_definitions "${compile_definitions} -DBUILD_WITH_TRAMPOLINE_ASM")\nendif()@' dobby-src/CMakeLists.txt || true
          else
            echo "No BUILD_WITH_TRAMPOLINE_ASM line found in CMakeLists.txt; skipping guard"
          fi

      - name: Build Dobby
        if: steps.cache-dobby.outputs.cache-hit != 'true'
        run: |
          cmake -S dobby-src -B dobby-build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DPlugin.Android.BionicLinkerUtil=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DDOBBY_BUILD_KERNEL_MODE=OFF
          cmake --build dobby-build --target dobby_static -j$(nproc)

      # -----------------------------------------------------------------------
      # Build libimgui.so
      # -----------------------------------------------------------------------
      - name: Configure
        run: |
          cmake -S imgui-vr -B build-quest \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMGUI_DIR=${{ github.workspace }} \
            -DOPENXR_DIR=${{ github.workspace }}/openxr-src \
            -DOPENXR_BUILD_DIR=${{ github.workspace }}/openxr-build \
            -DDOBBY_DIR=${{ github.workspace }}/dobby-src \
            -DDOBBY_BUILD_DIR=${{ github.workspace }}/dobby-build \
            -DIMGUI_VR_VULKAN=ON \
            -DIMGUI_VR_MINHOOK=OFF \
            -DIMGUI_VR_DOBBY=ON

      - name: Build
        run: cmake --build build-quest -j$(nproc)

      # -----------------------------------------------------------------------
      # Upload — download from Actions tab after run finishes
      # -----------------------------------------------------------------------
      - name: Upload libimgui.so
        uses: actions/upload-artifact@v4
        with:
          name: libimgui-quest-arm64
          path: build-quest/libimgui.so
          if-no-files-found: error

      - name: Show build info
        run: |
          ls -lh build-quest/libimgui.so || true
          file build-quest/libimgui.so || true
          nm -D build-quest/libimgui.so 2>/dev/null \
            | grep -E "lib_init|xrEndFrame|ImGui_ImplOpenXR" | head -20 || true
