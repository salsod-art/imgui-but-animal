name: Build libimgui.so (Quest / arm64)

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-quest:
    runs-on: ubuntu-latest
    name: Build - Quest (arm64-v8a)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK r26c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          add-to-path: true

      # -----------------------------------------------------------------------
      # OpenXR SDK (cached)
      # -----------------------------------------------------------------------
      - name: Cache OpenXR build
        uses: actions/cache@v4
        id: cache-openxr
        with:
          path: openxr-build
          key: openxr-arm64-r26c-v2

      - name: Clone OpenXR SDK
        run: |
          if [ ! -d openxr-src ]; then
            git clone --depth 1 https://github.com/KhronosGroup/OpenXR-SDK openxr-src
          fi

      - name: Build OpenXR SDK
        if: steps.cache-openxr.outputs.cache-hit != 'true'
        run: |
          cmake -S openxr-src -B openxr-build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_CONFORMANCE_TESTS=OFF
          cmake --build openxr-build -j$(nproc)

      # -----------------------------------------------------------------------
      # Dobby (cached)
      # Patches fix two NDK r26c incompatibilities:
      #   1. OSMemory undeclared in os_arch_features.h
      #   2. @PAGE/@PAGEOFF Apple asm syntax not supported by clang 17
      # -----------------------------------------------------------------------
      - name: Cache Dobby build
        uses: actions/cache@v4
        id: cache-dobby
        with:
          path: dobby-build
          key: dobby-arm64-r26c-v6

      - name: Clone Dobby
        run: |
          if [ ! -d dobby-src ]; then
            git clone --depth 1 https://github.com/jmpews/Dobby dobby-src
          fi

      - name: Patch Dobby for NDK r26c
        if: steps.cache-dobby.outputs.cache-hit != 'true'
        run: |
          python3 << 'PYEOF'
          import os, re

          # Fix 1: OSMemory undeclared in os_arch_features.h
          path = 'dobby-src/common/os_arch_features.h'
          with open(path, 'r') as f:
              c = f.read()
          if '#include <unistd.h>' not in c:
              c = '#include <unistd.h>\n#include <sys/mman.h>\n' + c
          c = c.replace('OSMemory::PageSize()', 'sysconf(_SC_PAGESIZE)')
          c = c.replace(
              'OSMemory::SetPermission(page, OSMemory::PageSize(), kReadExecute)',
              'mprotect(page, sysconf(_SC_PAGESIZE), PROT_READ | PROT_EXEC) == 0'
          )
          with open(path, 'w') as f:
              f.write(c)
          print("Patched", path)

          # Fix 2: @PAGE/@PAGEOFF Apple asm syntax -> Linux GOT syntax
          # Walk every source file and patch with regex so whitespace doesn't matter
          for root, dirs, files in os.walk('dobby-src'):
              for fname in files:
                  if not fname.endswith(('.cc', '.cpp', '.S', '.asm', '.s')):
                      continue
                  fpath = os.path.join(root, fname)
                  with open(fpath, 'r', errors='replace') as f:
                      c = f.read()
                  if '@PAGE' not in c:
                      continue
                  orig = c
                  # adrp rx, symbol@PAGE  ->  adrp rx, :got:symbol
                  c = re.sub(
                      r'adrp\s+(x\d+),\s*(\w+)@PAGE\b',
                      r'adrp \1, :got:\2',
                      c
                  )
                  # add rx, rx, symbol@PAGEOFF  ->  ldr rx, [rx, :got_lo12:symbol]
                  c = re.sub(
                      r'add\s+(x\d+),\s*(x\d+),\s*(\w+)@PAGEOFF\b',
                      r'ldr \1, [\2, :got_lo12:\3]',
                      c
                  )
                  if c != orig:
                      with open(fpath, 'w') as f:
                          f.write(c)
                      print("Patched", fpath)
          PYEOF

      - name: Build Dobby
        if: steps.cache-dobby.outputs.cache-hit != 'true'
        run: |
          cmake -S dobby-src -B dobby-build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF \
            -DPlugin.Android.BionicLinkerUtil=OFF
          cmake --build dobby-build --target dobby_static -j$(nproc)

      # -----------------------------------------------------------------------
      # Build libimgui.so
      # -----------------------------------------------------------------------
      - name: Configure
        run: |
          cmake -S imgui-vr -B build-quest \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DIMGUI_DIR=${{ github.workspace }} \
            -DOPENXR_DIR=${{ github.workspace }}/openxr-src \
            -DOPENXR_BUILD_DIR=${{ github.workspace }}/openxr-build \
            -DDOBBY_DIR=${{ github.workspace }}/dobby-src \
            -DDOBBY_BUILD_DIR=${{ github.workspace }}/dobby-build \
            -DIMGUI_VR_VULKAN=ON \
            -DIMGUI_VR_MINHOOK=OFF \
            -DIMGUI_VR_DOBBY=ON

      - name: Build
        run: cmake --build build-quest -j$(nproc)

      # -----------------------------------------------------------------------
      # Upload — download from Actions tab after run finishes
      # -----------------------------------------------------------------------
      - name: Upload libimgui.so
        uses: actions/upload-artifact@v4
        with:
          name: libimgui-quest-arm64
          path: build-quest/libimgui.so
          if-no-files-found: error

      - name: Show build info
        run: |
          ls -lh build-quest/libimgui.so
          file build-quest/libimgui.so
          nm -D build-quest/libimgui.so 2>/dev/null \
            | grep -E "lib_init|xrEndFrame|ImGui_ImplOpenXR" | head -20
